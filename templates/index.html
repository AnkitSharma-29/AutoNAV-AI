<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Drone AI: High-Fidelity Simulator 🚁</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --primary: #3498db; --bg: #020617; --card: rgba(30, 41, 59, 0.7); --text: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 380px; background: var(--card); backdrop-filter: blur(12px); padding: 25px; box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 10; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.1); }
        h1 { font-size: 1.4rem; color: #60a5fa; margin-bottom: 25px; letter-spacing: -0.5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .card { background: rgba(51, 65, 85, 0.5); padding: 18px; border-radius: 16px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        h3 { margin-top: 0; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        
        label { font-size: 0.75rem; color: #cbd5e1; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; text-transform: uppercase; font-size: 0.75rem; }
        .btn:hover { filter: brightness(1.2); transform: scale(1.02); }
        .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
        .status { font-size: 0.7rem; margin-top: 8px; color: #34d399; font-family: monospace; }
        
        #viewport { flex-grow: 1; position: relative; cursor: crosshair; }
        .hud { position: absolute; padding: 15px; border-radius: 10px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); font-family: 'Courier New', Courier, monospace; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .hud-left { top: 20px; left: 20px; }
        .hud-right { top: 20px; right: 20px; text-align: right; }
        
        .toolbar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--card); backdrop-filter: blur(10px); padding: 10px; border-radius: 50px; display: flex; gap: 10px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 100; }
        .tool-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 18px; border-radius: 25px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .tool-btn:hover { background: rgba(255,255,255,0.2); }
        .tool-btn.active { background: #3b82f6; font-weight: bold; }

        .preset-group { display: flex; gap: 5px; margin-top: 10px; }
        .preset-btn { flex: 1; padding: 6px; font-size: 0.65rem; background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: #94a3b8; cursor: pointer; }
        .preset-btn:hover { border-color: #3b82f6; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>JETSON AI NAV 🚁</h1>
        
        <div class="card">
            <h3>Environment Overrides</h3>
            <div class="controls">
                <label>Rain: <span id="rain-val">Low</span></label>
                <input type="range" id="rain-slider" min="0" max="10" value="2" oninput="updateWeather()">
                <label>Simulation Mode:</label>
                <select id="sim-preset" style="background:#1e293b; color:white; border:none; padding:8px; border-radius:5px;">
                    <option value="mountains">Mountains</option>
                    <option value="city">Urban Maze</option>
                </select>
                <div class="preset-group">
                    <button class="preset-btn" onclick="applyWeather('rain')">🌧️ Rain</button>
                    <button class="preset-btn" onclick="applyWeather('wind')">🌪️ Wind</button>
                    <button class="preset-btn" onclick="applyWeather('both')">🌩️ Storm</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Module 1-b: Vertical PID</h3>
            <div class="controls">
                <label>Altitude: <span id="pid-alt-val">10m</span></label>
                <input type="range" id="pid-alt" min="1" max="25" value="10" oninput="updateVal('pid-alt')">
                <label>Wind/Turbulence: <span id="pid-wind-val">2.0</span></label>
                <input type="range" id="pid-wind" min="0" max="10" value="2" oninput="updateVal('pid-wind')">
                <button class="btn" onclick="runSim('pid')">Deploy Flight Logic</button>
                <div id="pid-status" class="status"></div>
            </div>
        </div>

        <div class="card">
            <h3>Module 1-a: Path Planning</h3>
            <div class="controls">
                <label>Obstacle Density: <span id="astar-den-val">20%</span></label>
                <input type="range" id="astar-den" min="5" max="45" value="20" oninput="updateVal('astar-den')">
                <button class="btn" onclick="runSim('astar')">Compute & Navigate</button>
                <div id="astar-status" class="status"></div>
            </div>
        </div>
    </div>

    <div id="viewport">
        <div class="hud hud-left">
            <b>JETSON AGX ORIN</b><br>
            TEMP: 44°C<br>
            LOAD: 18%<br>
            GPS: <b style="color:#ef4444">DENIED</b>
        </div>
        <div class="hud hud-right" id="telemetry">
            <b>LIVE TELEMETRY</b><br>
            ALT: <span id="tel-alt">0.00</span>m<br>
            DIST: <span id="tel-dist">---</span>m<br>
            BAT: 88%
        </div>

        <div class="toolbar">
            <button class="tool-btn active" onclick="setMode('explore')" id="btn-explore">🔍 Explore</button>
            <button class="tool-btn" onclick="setMode('start')" id="btn-start">📍 Set Start</button>
            <button class="tool-btn" onclick="setMode('goal')" id="id-goal">🏁 Set Goal</button>
            <button class="tool-btn" onclick="setMode('obs')" id="btn-obs">🚧 Add Obstacle</button>
            <button class="tool-btn" onclick="clearMarkers()" style="background:rgba(239, 68, 68, 0.2)">🗑 Clear</button>
        </div>
    </div>

    <script>
        function updateVal(id) {
            const val = document.getElementById(id).value;
            const span = document.getElementById(id + '-val');
            if (id === 'astar-den') span.innerText = val + '%';
            else span.innerText = (id === 'pid-wind' ? (val/1).toFixed(1) : val + 'm');
        }

        function applyWeather(mode) {
            const rain = document.getElementById('rain-slider');
            const wind = document.getElementById('pid-wind');
            if (mode === 'rain') { rain.value = 10; wind.value = 2; }
            else if (mode === 'wind') { rain.value = 0; wind.value = 10; }
            else { rain.value = 10; wind.value = 10; }
            updateWeather();
            updateVal('pid-wind');
        }

        let scene, camera, renderer, drone, droneBody, fpvCamera, rainParticles, terrain, controls;
        let startMarker, goalMarker;
        let manualObstacles = [];
        let placementMode = 'explore';
        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        const container = document.getElementById('viewport');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.FogExp2(0x020617, 0.015);

            camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.1, 2000);
            camera.position.set(20, 15, 20);
            fpvCamera = new THREE.PerspectiveCamera(90, 320 / 200, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera under floor


            const ambient = new THREE.AmbientLight(0x404040, 1.2);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);

            createTerrain();
            createWeather();
            createDrone();
            
            let pointerPos = {x:0, y:0};
            document.addEventListener('pointerdown', (e) => {
                if (e.target === renderer.domElement) pointerPos = {x: e.clientX, y: e.clientY};
            });
            // Attach to document to bypass OrbitControls stopPropagation
            document.addEventListener('pointerup', (e) => {
                if (e.target !== renderer.domElement) return;
                const dist = Math.hypot(e.clientX - pointerPos.x, e.clientY - pointerPos.y);
                if (dist > 5) return; // Prevent raycast if the mouse was dragged
                onMapClick(e);
            });
            animate();
        }

        function createTerrain() {
            // Central Flat Arena for precise placement (20x20)
            const arenaGeo = new THREE.PlaneGeometry(20, 20);
            const arena = new THREE.Mesh(arenaGeo, new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            arena.rotation.x = -Math.PI / 2;
            arena.receiveShadow = true;
            arena.name = "arena";
            scene.add(arena);

            // Precision Chessboard Grid mapping exactly to A*
            const grid = new THREE.GridHelper(20, 20, 0x3b82f6, 0x334155);
            grid.position.y = 0.01;
            scene.add(grid);

            // Procedural Mountains (Background)
            const bgGeo = new THREE.PlaneGeometry(300, 300, 64, 64);
            const pos = bgGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i), y = pos.getY(i);
                const dist = Math.sqrt(x*x + y*y);
                const h = dist < 12 ? 0 : Math.sin(x/10) * Math.cos(y/10) * 3 + (dist-12)*0.3;
                pos.setZ(i, h);
            }
            bgGeo.computeVertexNormals();
            terrain = new THREE.Mesh(bgGeo, new THREE.MeshStandardMaterial({ color: 0x1e293b, flatShading: true }));
            terrain.rotation.x = -Math.PI / 2;
            terrain.position.y = -0.1;
            terrain.receiveShadow = true;
            terrain.name = "terrain";
            scene.add(terrain);
        }

        function createWeather() {
            const geo = new THREE.BufferGeometry();
            const count = 15000;
            const posArr = new Float32Array(count * 3);
            for(let i=0; i<count*3; i+=3) {
                posArr[i] = (Math.random()-0.5)*300;
                posArr[i+1] = Math.random()*100;
                posArr[i+2] = (Math.random()-0.5)*300;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            rainParticles = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xaaaaaa, size: 0.1}));
            scene.add(rainParticles);
        }

        function createDrone() {
            drone = new THREE.Group();
            droneBody = new THREE.Group();
            
            // Central Hub
            const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 16), new THREE.MeshStandardMaterial({color: 0x1e293b, metalness: 0.8}));
            droneBody.add(hub);
            
            // X-Arms
            const armMat = new THREE.MeshStandardMaterial({color: 0x0f172a, roughness: 0.9});
            const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 2.5), armMat); arm1.rotation.y = Math.PI/4; droneBody.add(arm1);
            const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 2.5), armMat); arm2.rotation.y = -Math.PI/4; droneBody.add(arm2);
            
            // Rotors and LEDs
            const rotorMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.2});
            const positions = [[1,1,0xff0000], [1,-1,0xff0000], [-1,1,0x00ff00], [-1,-1,0x00ff00]];
            positions.forEach(p => {
                const dist = 0.85;
                const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2), armMat);
                motor.position.set(p[0]*dist, 0.1, p[1]*dist);
                droneBody.add(motor);
                
                const rotor = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.02), rotorMat);
                rotor.position.set(p[0]*dist, 0.2, p[1]*dist);
                rotor.name = "rotor";
                droneBody.add(rotor);
                
                const led = new THREE.PointLight(p[2], 1, 3);
                led.position.set(p[0]*dist, -0.1, p[1]*dist);
                droneBody.add(led);
                
                const ledMesh = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: p[2]}));
                ledMesh.position.copy(led.position);
                droneBody.add(ledMesh);
            });
            
            // Landing Gear
            const skidMat = new THREE.MeshStandardMaterial({color: 0xffffff});
            const skid1 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.5), skidMat); skid1.position.set(0.4, -0.3, 0); skid1.rotation.x = Math.PI/2; droneBody.add(skid1);
            const skid2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.5), skidMat); skid2.position.set(-0.4, -0.3, 0); skid2.rotation.x = Math.PI/2; droneBody.add(skid2);
            const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4), skidMat); leg1.position.set(0.4, -0.15, 0); droneBody.add(leg1);
            const leg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4), skidMat); leg2.position.set(-0.4, -0.15, 0); droneBody.add(leg2);

            // FPV Camera Gimbal (Front Facing -Z)
            const gimbal = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshStandardMaterial({color: 0x111111}));
            gimbal.position.set(0, -0.15, -0.4);
            droneBody.add(gimbal);
            fpvCamera.position.set(0, -0.15, -0.5);
            fpvCamera.lookAt(0, -0.15, -10);
            droneBody.add(fpvCamera);

            drone.add(droneBody);
            drone.scale.set(0.15, 0.15, 0.15);
            drone.position.y = 0.05; // Ground level
            scene.add(drone);
        }

        function setMode(mode) {
            placementMode = mode;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-' + mode) || document.getElementById('id-goal');
            if (btn) btn.classList.add('active');
        }

        function onMapClick(event) {
            if (placementMode === 'explore') return;
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            const hit = intersects.find(i => i.object.name === "arena" || i.object.name === "terrain");
            
            if (hit) {
                const pt = hit.point;
                // Precision Snapping to 1x1 grid (-10 to 10)
                const gx = Math.floor(pt.x) + 0.5;
                const gz = Math.floor(pt.z) + 0.5;
                
                if (gx < -9.5 || gx > 9.5 || gz < -9.5 || gz > 9.5) return;

                // Backend grid indices (0-19)
                const backendX = Math.round(gx + 9.5);
                const backendZ = Math.round(gz + 9.5);

                if (placementMode === 'start') {
                    if (startMarker) scene.remove(startMarker);
                    startMarker = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color: 0x22c55e}));
                    startMarker.position.set(gx, 0.4, gz);
                    startMarker.castShadow = true;
                    scene.add(startMarker);
                    drone.position.set(gx, 5, gz);
                } else if (placementMode === 'goal') {
                    if (goalMarker) scene.remove(goalMarker);
                    goalMarker = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.5, 0.8), new THREE.MeshStandardMaterial({color: 0x3b82f6}));
                    goalMarker.position.set(gx, 0.75, gz);
                    goalMarker.castShadow = true;
                    scene.add(goalMarker);
                } else if (placementMode === 'obs') {
                    const obsH = 2 + Math.random()*2;
                    const obs = new THREE.Mesh(new THREE.BoxGeometry(0.95, obsH, 0.95), new THREE.MeshStandardMaterial({color: 0xef4444}));
                    obs.position.set(gx, obsH/2, gz);
                    obs.castShadow = true;
                    scene.add(obs);
                    manualObstacles.push({x: backendX, z: backendZ, mesh: obs});
                }
            }
        }

        function clearMarkers() {
            if (startMarker) { scene.remove(startMarker); startMarker = null; }
            if (goalMarker) { scene.remove(goalMarker); goalMarker = null; }
            manualObstacles.forEach(o => scene.remove(o.mesh));
            manualObstacles = [];
        }

        function runSim(type) {
            const status = document.getElementById(type + '-status');
            const btn = document.querySelector(`button[onclick="runSim('${type}')"]`);
            const oldText = btn.innerText;
            btn.innerText = "⏳ LOADING...";
            status.innerText = 'Calculating Optimal Trajectory...';
            
            let params = `?density=${document.getElementById('astar-den').value / 100}`;
            if (type === 'pid') {
                params = `?altitude=${document.getElementById('pid-alt').value}&wind=${document.getElementById('pid-wind').value}`;
            } else if (type === 'astar') {
                if (startMarker) params += `&start=${Math.round(startMarker.position.x + 9.5)},${Math.round(startMarker.position.z + 9.5)}`;
                if (goalMarker) params += `&goal=${Math.round(goalMarker.position.x + 9.5)},${Math.round(goalMarker.position.z + 9.5)}`;
                if (manualObstacles.length > 0) {
                    const obsStr = manualObstacles.map(o => `${o.x},${o.z}`).join(';');
                    params += `&manual_obs=${obsStr}`;
                }
            }

            fetch('/run/' + type + params)
                .then(res => res.json())
                .then(data => {
                    btn.innerText = oldText;
                    if (data.success) {
                        fetch(`/static/${type}_data.json?` + Date.now())
                            .then(res => res.json())
                            .then(sim => {
                                const path = sim.path || sim;
                                if (path.length === 0) {
                                    status.innerText = 'FAILED: Path blocked by obstacles!';
                                    status.style.color = '#ef4444'; // Red
                                } else {
                                    status.innerText = 'Ready! Flying...';
                                    status.style.color = '#34d399'; // Green
                                    animateFlight(path, type);
                                }
                            });
                    } else {
                        status.innerText = 'Error: ' + data.error;
                        status.style.color = '#ef4444';
                    }
                });
        }

        function animateFlight(path, type) {
            let phase = 'takeoff';
            let i = 0;
            const flightAlt = 2.0; // Relative to the massive chessboard scale
            const groundAlt = 0.05;
            
            if (path.length > 0) {
                drone.position.set(path[0].x - 9.5, groundAlt, path[0].z - 9.5);
            }

            const timer = setInterval(() => {
                if (phase === 'takeoff') {
                    const target = new THREE.Vector3(drone.position.x, flightAlt, drone.position.z);
                    drone.position.lerp(target, 0.08);
                    if (drone.position.y > flightAlt - 0.1) phase = 'navigate';
                } 
                else if (phase === 'navigate') {
                    if (i >= path.length) { 
                        phase = 'land'; 
                        return; 
                    }
                    const p = path[i];
                    const target = new THREE.Vector3(p.x - 9.5, flightAlt, p.z - 9.5);
                    
                    if (drone.position.distanceTo(target) > 0.1) {
                        const lookTarget = target.clone();
                        lookTarget.y = drone.position.y;
                        drone.lookAt(lookTarget);
                        drone.position.lerp(target, 0.15);
                    } else {
                        i++; // Reached waypoint
                    }
                }
                else if (phase === 'land') {
                    const target = new THREE.Vector3(drone.position.x, groundAlt, drone.position.z);
                    drone.position.lerp(target, 0.08);
                    if (drone.position.y <= groundAlt + 0.05) {
                        clearInterval(timer);
                    }
                }
                
                if(controls) controls.target.copy(drone.position);
                document.getElementById('tel-alt').innerText = drone.position.y.toFixed(2);
            }, 50);
        }

        function updateWeather() {
            const intensity = document.getElementById('rain-slider').value;
            rainParticles.visible = intensity > 0;
            document.getElementById('rain-val').innerText = intensity > 7 ? 'Extreme' : (intensity > 0 ? 'Normal' : 'None');
        }

        function animate() {
            requestAnimationFrame(animate);
            if(controls) controls.update();
            const pos = rainParticles.geometry.attributes.position;
            const rain = document.getElementById('rain-slider').value;
            for(let i=0; i<pos.count; i++) {
                let y = pos.getY(i); y -= (0.4 + rain*0.1);
                if (y < 0) y = 100;
                pos.setY(i, y);
            }
            pos.needsUpdate = true;
            
            // Realistic Drone Hover & Rotor Animation
            const time = Date.now() * 0.002;
            if(droneBody) {
                droneBody.position.y = Math.sin(time) * 0.4;
                droneBody.rotation.z = Math.sin(time * 0.5) * 0.05;
                droneBody.rotation.x = Math.cos(time * 0.7) * 0.05;
                droneBody.children.forEach(c => { if(c.name === "rotor") c.rotation.y += 0.6; });
            }
            
            // Render Pipeline (Main + PiP)
            renderer.setScissorTest(true);
            
            // 1. Main Viewport
            renderer.setViewport(0, 0, container.clientWidth, container.clientHeight);
            renderer.setScissor(0, 0, container.clientWidth, container.clientHeight);
            renderer.render(scene, camera);
            
            // 2. FPV Picture-in-Picture (Bottom Right)
            const pipW = 320, pipH = 200, padding = 20;
            renderer.setViewport(container.clientWidth - pipW - padding, padding, pipW, pipH);
            renderer.setScissor(container.clientWidth - pipW - padding, padding, pipW, pipH);
            // Clear depth so PiP renders on top of the main scene perfectly
            renderer.clearDepth();
            renderer.render(scene, fpvCamera);
            
            renderer.setScissorTest(false);
        }

        init3D();
    </script>
</body>
</html>
